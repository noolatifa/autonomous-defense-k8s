---
- name: 01 - Kubernetes Cluster Installation (Ubuntu 24.04)
  hosts: kubernetes
  become: true
  vars:
    current_user: "{{ ansible_user }}"
    current_user_home: "/home/{{ ansible_user }}"
    k8s_version: "1.30"

  tasks:

    # --- System Prerequisites ---

    - name: Disable swap permanently
      shell: |
        swapoff -a
        sed -i '/swap/d' /etc/fstab

    - name: Load required kernel modules
      shell: |
        modprobe overlay
        modprobe br_netfilter

    - name: Persist kernel modules on boot
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Configure kernel networking parameters for Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: Apply sysctl parameters
      command: sysctl --system

    # --- Container Runtime (Containerd) ---

    - name: Install system dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
          - git
          - python3
          - python3-pip
          - containerd
        state: present
        update_cache: yes

    - name: Configure Containerd with SystemdCgroup
      shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
        systemctl restart containerd
        systemctl enable containerd

    # --- Kubernetes Repository ---

    - name: Add Kubernetes apt repository and GPG key
      shell: |
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key | \
          gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] \
          https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /" | \
          tee /etc/apt/sources.list.d/kubernetes.list
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Install kubelet kubeadm kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Hold Kubernetes packages from automatic updates
      shell: apt-mark hold kubelet kubeadm kubectl

    # --- Cluster Initialization ---

    - name: Initialize Kubernetes cluster with kubeadm
      shell: kubeadm init --pod-network-cidr=192.168.0.0/16
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create .kube directory for user
      file:
        path: "{{ current_user_home }}/.kube"
        state: directory
        owner: "{{ current_user }}"
        group: "{{ current_user }}"
        mode: '0755'

    - name: Copy admin.conf to user kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ current_user_home }}/.kube/config"
        remote_src: yes
        owner: "{{ current_user }}"
        group: "{{ current_user }}"
        mode: '0644'

    # --- Network Plugin (Calico) ---

    - name: Install Calico network plugin
      become: false
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/calico.yaml
      environment:
        KUBECONFIG: "{{ current_user_home }}/.kube/config"

    - name: Remove control-plane taint for single-node cluster
      become: false
      shell: kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true
      environment:
        KUBECONFIG: "{{ current_user_home }}/.kube/config"

    # --- Verification ---

    - name: Wait for all nodes to be ready
      become: false
      shell: kubectl wait --for=condition=Ready nodes --all --timeout=120s
      environment:
        KUBECONFIG: "{{ current_user_home }}/.kube/config"
      retries: 5
      delay: 15

    - name: Display cluster node status
      become: false
      shell: kubectl get nodes
      environment:
        KUBECONFIG: "{{ current_user_home }}/.kube/config"
      register: nodes_output

    - name: Show node status
      debug:
        msg: "{{ nodes_output.stdout }}"
