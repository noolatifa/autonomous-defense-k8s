apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-role
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defense-dashboard
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: defense-dashboard
  template:
    metadata:
      labels:
        app: defense-dashboard
    spec:
      serviceAccountName: dashboard
      containers:
        - name: dashboard
          image: defense-dashboard:v2-clean
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: audit-log
              mountPath: /var/log/agent
      volumes:
        - name: audit-log
          hostPath:
            path: /var/log/agent
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: defense-dashboard
  namespace: apps
spec:
  type: NodePort
  selector:
    app: defense-dashboard
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 31000
