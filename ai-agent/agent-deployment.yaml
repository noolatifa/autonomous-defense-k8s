apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: apps
  labels:
    app: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      serviceAccountName: ai-agent
      containers:
        - name: ai-agent
          image: ai-agent:latest
          imagePullPolicy: Never
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-secret
                  key: GROQ_API_KEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: audit-log
              mountPath: /var/log/agent
      volumes:
        - name: audit-log
          emptyDir: {}
      restartPolicy: Always
