apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-cible
  namespace: apps
  labels:
    app: web-cible
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-cible
  template:
    metadata:
      labels:
        app: web-cible
        run: web-cible
    spec:
      containers:
        - name: web-cible
          image: nginx:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-cible
  namespace: apps
spec:
  selector:
    app: web-cible
  ports:
    - port: 80
      targetPort: 80
